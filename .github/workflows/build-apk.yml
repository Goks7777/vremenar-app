name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Nastavitev Jave 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Nastavitev Android SDK okolja
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Namesti Gradle ročno
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Zgradi APK
        run: |
          gradle assembleRelease --stacktrace --no-daemon

      - name: Shrani APK kot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vremenar-APK
          path: app/build/outputs/apk/release/*.apk
